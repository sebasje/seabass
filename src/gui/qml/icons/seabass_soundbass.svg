<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!--
    "Sound Bass": option 3 of the seabass icon proposal (djconvert app
    icon / watermark). A fish silhouette clipped from vertical equalizer
    bars, in the app's Current/Kelp palette.
  -->
  <defs>
    <linearGradient id="gradCurrent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74cdf5"/>
      <stop offset="1" stop-color="#123a52"/>
    </linearGradient>
    <linearGradient id="gradKelp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5be0c0"/>
      <stop offset="1" stop-color="#0b6852"/>
    </linearGradient>
    <clipPath id="fishClip" clipPathUnits="userSpaceOnUse">
      <path d="M20,0 C20,7 12,11 2,9 C-2,14 -14,12 -20,4 L-14,0 L-20,-4 C-14,-12 -2,-14 2,-9 C12,-11 20,-7 20,0 Z" transform="translate(100,100) scale(4.3)"/>
    </clipPath>
  </defs>
  <g clip-path="url(#fishClip)">
    <rect x="20" y="75" width="12" height="50" fill="url(#gradCurrent)"/>
    <rect x="36" y="55" width="12" height="90" fill="url(#gradKelp)"/>
    <rect x="52" y="35" width="12" height="130" fill="url(#gradCurrent)"/>
    <rect x="68" y="20" width="12" height="160" fill="url(#gradKelp)"/>
    <rect x="84" y="25" width="12" height="150" fill="url(#gradCurrent)"/>
    <rect x="100" y="20" width="12" height="160" fill="url(#gradKelp)"/>
    <rect x="116" y="35" width="12" height="130" fill="url(#gradCurrent)"/>
    <rect x="132" y="55" width="12" height="90" fill="url(#gradKelp)"/>
    <rect x="148" y="75" width="12" height="50" fill="url(#gradCurrent)"/>
    <rect x="164" y="90" width="12" height="20" fill="url(#gradKelp)"/>
  </g>
  <g transform="translate(100,100) scale(4.3)">
    <circle cx="10" cy="-2.4" r="4.2" fill="#eef6fb"/>
    <circle cx="11.575" cy="-2.4" r="2.0" fill="#0d2b36"/>
  </g>
</svg>
